<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA Exclusive Web3 Premium Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 40px 20px;
            background-color: #1a1a1a;
            border-bottom: 2px solid #ff4500;
        }
        .header-title {
            font-size: 2.5rem;
            color: #ff9800;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .header-subtitle {
            font-size: 1.2rem;
            color: #bbbbbb;
            margin-bottom: 30px;
        }
        .services-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .service-box {
            background-color: #2a2a2a;
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #ff4500;
            width: 250px;
            transition: 0.3s;
        }
        .service-box:hover {
            background-color: #ff4500;
            transform: translateY(-5px);
        }
        .service-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .order-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .order-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">FA Exclusive Web3 Premium Store</div>
    <div class="header-subtitle">আমরা আপনাকে সার্ভিস প্রোভাইড করি</div>
    
    <div class="services-container">
        <div class="service-box">
            <div class="service-title">Twitter Premium</div>
            <a href="#" class="order-btn">অর্ডার করুন</a>
        </div>
        
        <div class="service-box">
            <div class="service-title">Telegram Premium</div>
            <a href="#" class="order-btn">অর্ডার করুন</a>
        </div>
    </div>
</header>

</body>
</html>
